<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoOps AI — Infrastructure Monitoring, Failure Prediction & Self-Healing Platform</title>
    
    <!-- Meta tags for SRE / DevOps Observability -->
    <meta name="description" content="AI-Powered Infrastructure Monitoring, Failure Prediction & Self-Healing Platform. Combines Isolation Forest anomaly detection, Random Forest failure prediction, and autonomous Kubernetes remediation.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#030712'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Custom Dark SRE Theme Stylesheet -->
    <link rel="stylesheet" href="theme.css">
    
    <!-- React 17 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    
    <!-- Babel Standalone (JSX Compiler) -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        Babel.registerPreset("react-classic", {
            presets: [[Babel.availablePresets["react"], { runtime: "classic" }]]
        });
    </script>
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#070b13] text-slate-100 font-sans min-h-screen selection:bg-cyan-500/30 selection:text-cyan-200">
    <!-- React Mount Node -->
    <div id="root">
        <div class="flex items-center justify-center h-screen bg-[#070b13]">
            <div class="text-center space-y-4">
                <div class="w-12 h-12 border-3 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-slate-400 font-medium text-xs tracking-wider uppercase animate-pulse">Initializing AutoOps AI Control Center...</p>
            </div>
        </div>
    </div>

    <!-- Modular Application Scripts compiled via Babel -->
    <script type="text/babel" data-presets="react-classic" src="js/api.js"></script>
    <script type="text/babel" data-presets="react-classic" src="js/components.js"></script>
    <script type="text/babel" data-presets="react-classic" src="js/pages/overview.js"></script>
    <script type="text/babel" data-presets="react-classic" src="js/pages/infrastructure.js"></script>
    <script type="text/babel" data-presets="react-classic" src="js/pages/ai_intelligence.js"></script>
    <script type="text/babel" data-presets="react-classic" src="js/pages/self_healing.js"></script>
    <script type="text/babel" data-presets="react-classic" src="js/pages/ml_lab.js"></script>
    <script type="text/babel" data-presets="react-classic" src="js/pages/cicd.js"></script>
    <script type="text/babel" data-presets="react-classic" src="js/pages/settings.js"></script>
    <script type="text/babel" data-presets="react-classic" src="js/app.js"></script>
</body>
</html>
